server {
    listen 80;
    listen [::]:80;
    server_name sub2api-local.85-155-178-254.sslip.io;
    location /.well-known/acme-challenge/ { root /www/server/nginx/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sub2api-local.85-155-178-254.sslip.io;
    ssl_certificate /etc/letsencrypt/live/sub2api-local.85-155-178-254.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub2api-local.85-155-178-254.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;
    add_header Cache-Control "no-store" always;
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }
}
